<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jaanemaan Validator</title>
  <style>
    body {
      background-color: #1e1e2e;
      color: #cdd6f4;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #252739;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      text-align: center;
      max-width: 420px;
      width: 90%;
    }
    h2 {
      margin-bottom: 1.5rem;
      color: #f5c2e7;
    }
    input {
      width: 80%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #45475a;
      background: #181825;
      color: #fff;
      font-size: 1rem;
      outline: none;
      margin-bottom: 1rem;
    }
    input:focus {
      border-color: #f5c2e7;
    }
    button {
      padding: 10px 24px;
      font-size: 1rem;
      background: #cba6f7;
      color: #11111b;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover {
      background: #b4befe;
    }
    #result {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      min-height: 28px;
    }
    .correct {
      color: #a6e3a1;
    }
    .wrong {
      color: #f38ba8;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Who is Emu's jaanemaan?</h2>
    <input type="text" id="answerInput" placeholder="Type here..." autocomplete="off">
    <br>
    <button onclick="checkAnswer()">Submit</button>
    <div id="result"></div>
  </div>

  <script>
    function checkAnswer() {
      const input = document.getElementById("answerInput").value.trim().toLowerCase();
      const resultDiv = document.getElementById("result");

      const validAnswers = [
        "zeba",
        "zannatul",
        "ferdous",
        "zannatul ferdous zeba"
      ];

      if (validAnswers.includes(input)) {
        resultDiv.className = "correct";
        resultDiv.textContent = "Yeeeeeeeeeeeeee!!!!!! You're correct 🎉!!!!!! Emuuuuuuu loveeeeeeesssss Zebaaaaaaaa";
      } else {
        resultDiv.className = "wrong";
        resultDiv.textContent = "baal jaano tmi amr;; eishb ulta palta kotha bolle gua diya gorom rod dhukay dibo🖕";
      }
    }

    // Allow pressing "Enter" key
    document.getElementById("answerInput").addEventListener("keyup", function(e) {
      if (e.key === "Enter") checkAnswer();
    });
  </script>

</body>
</html>
